quarkus.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/rxlight_test?sslmode=disable
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.hibernate-orm.database.generation=none
quarkus.http.port=3000
quarkus.application.name=rxlight-api
quarkus.redis.hosts[0]=redis://localhost:6379/0?protocol=resp3
# flyway
quarkus.flyway.sql-migration-prefix=V
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.enabled=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.schemas=public